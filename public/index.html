<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El muro Full-Stack</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="bg-slate-500 text-white min-h-screen p-8">
    <div class="max-w-2xl mx-auto">
      <h1 class="text-4xl text-center mb-8 text-emerald-400">
        El muro Full-Stack
      </h1>

      <!-- Form -->
      <form id="formulario" class="bg-slate-800 p-6 rounded-xl shadow-lg mb-10">
        <div class="mb-4">
          <input
            type="text"
            id="titulo"
            placeholder="Titulo del post"
            required
            class="w-full px-4 py-2 bg-slate-600 rounded-lg text-white"
          />
          <div class="mb-4">
            <textarea
              id="cuerpo"
              placeholder="Contenido"
              rows="4"
              required
              class="w-full px-4 py-2 mt-6 rounded-lg text-white"
            ></textarea>
          </div>
          <button
            type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-400 text-white font-bold py-2 rounded-lg"
          >
            Crear Post
          </button>
        </div>
      </form>
      <!-- Lista posts -->
      <div id="listaPosts" class="space-y-4"></div>
    </div>
    <!-- Script -->
    <script type="module" src="app.js"></script>
  </body>
</html>
